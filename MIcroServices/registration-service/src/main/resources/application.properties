# Configuration du serveur
server.port=8083
spring.application.name=registration-service

# Configuration de la base de données H2
spring.datasource.url=jdbc:h2:mem:registrationdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuration JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Désactiver Eureka pour le moment
eureka.client.enabled=false

# DevTools pour le rechargement automatique
spring.devtools.restart.enabled=true

# URLs des autres microservices (pour la communication inter-services)
event.service.url=http://localhost:8082/api/events
user.service.url=http://localhost:8081/api/users
notification.service.url=http://localhost:8084/api/notifications