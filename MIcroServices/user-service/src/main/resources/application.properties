# ===================================
# CONFIGURATION USER SERVICE
# ===================================

# Port du microservice User
server.port=8081

# Nom de l'application
spring.application.name=user-service

# ===================================
# CONFIGURATION H2 DATABASE
# ===================================

# URL de la base de données H2 en mémoire
spring.datasource.url=jdbc:h2:mem:userdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialect Hibernate pour H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Crée/met à jour automatiquement les tables
spring.jpa.hibernate.ddl-auto=update

# Affiche les requêtes SQL dans la console (utile pour déboguer)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================
# CONSOLE H2 (pour voir la BDD dans le navigateur)
# ===================================

# Active la console H2
spring.h2.console.enabled=true

# URL pour accéder à la console : http://localhost:8081/h2-console
spring.h2.console.path=/h2-console

# ===================================
# EUREKA CLIENT (pour plus tard)
# ===================================

# Désactive Eureka pour l'instant (on l'activera quand on reliera les microservices)
eureka.client.enabled=false

# ===================================
# SPRING BOOT DEVTOOLS
# ===================================

# Active le redémarrage automatique quand tu modifies le code
spring.devtools.restart.enabled=true